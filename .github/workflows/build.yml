name: Build
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the code compiles
        run: python -m py_compile app/events.py
      - name: Build the package
        run: |
          mkdir -p dist
          cp app/*.py dist/
      - name: Upload the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: events-app
          path: dist/
          if-no-files-found: error
